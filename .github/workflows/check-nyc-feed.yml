name: Check NYC Ferry feed freshness

on:
  schedule:
    - cron: '15 12 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'schedules/**'
      - 'scripts/check-nyc-feed-freshness.py'
      - 'scripts/import-november-live.py'
      - 'scripts/import-november-crew.py'
      - '.github/workflows/check-nyc-feed.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare published GTFS with reviewed live maps
        run: python3 scripts/check-nyc-feed-freshness.py --archive-dir feed-candidate
      - name: Draft regenerated November live and crew maps from the new feed
        if: failure()
        run: |
          set -x
          zip=$(ls feed-candidate/nycferry-*.zip 2>/dev/null | head -n 1)
          if [ -z "$zip" ]; then echo 'No feed was fetched; nothing to draft.'; exit 0; fi
          cp "$zip" schedules/fall-2026-sources/
          python3 scripts/import-november-live.py "schedules/fall-2026-sources/$(basename "$zip")" 2>&1 | tee feed-candidate/import.txt
          python3 scripts/import-november-crew.py 2>&1 | tee -a feed-candidate/import.txt
          cp schedules/november-2026-live.json schedules/november-2026-crew.json feed-candidate/
          git diff --stat -- schedules/november-2026-live.json schedules/november-2026-crew.json | tee -a feed-candidate/import.txt
          git diff -- schedules/november-2026-crew.json > feed-candidate/november-crew.diff || true
          git show HEAD:schedules/november-2026-live.json > feed-candidate/november-live-reviewed.json
          python3 -I scripts/compare-november-live.py feed-candidate/november-live-reviewed.json schedules/november-2026-live.json | tee -a feed-candidate/import.txt
      - name: Upload the fetched feed and draft map for review
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nyc-ferry-feed-candidate
          path: feed-candidate/
          if-no-files-found: ignore
          retention-days: 14
